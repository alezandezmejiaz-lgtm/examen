<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Concesionario</title>
  <!-- CDN Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Mi Concesionario</a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container mt-5">
    <!-- Sistema de rejilla: 3 columnas -->
    <div class="row">
      <!-- Card 1 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Imagen de vehículo">
          <div class="card-body">
            <h5 class="card-title">Modelo Deportivo</h5>
            <p class="card-text">Auto de alta gama con diseño aerodinámico y tecnología de punta.</p>
            <a href="#" class="btn btn-primary">Ver más</a>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Imagen de vehículo">
          <div class="card-body">
            <h5 class="card-title">Sedán Familiar</h5>
            <p class="card-text">Espacio, confort y seguridad para toda la familia en cada viaje.</p>
            <a href="#" class="btn btn-primary">Ver más</a>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Imagen de vehículo">
          <div class="card-body">
            <h5 class="card-title">SUV Todo Terreno</h5>
            <p class="card-text">Potencia y versatilidad para enfrentar cualquier camino sin límites.</p>
            <a href="#" class="btn btn-primary">Ver más</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <div class="row mt-5">
      <div class="col-md-6 offset-md-3">
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Ingresa tu consulta">
        </div>
        <button class="btn btn-primary w-100">Enviar</button>
      </div>
    </div>
  </div>

  <!-- JS de Bootstrap (opcional para componentes interactivos) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
